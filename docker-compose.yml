name: bimbo-pipeline

x-spark-common: &spark-common
  image: apache/spark:3.5.3
  env_file: .env
  environment:
    MINIO_ENDPOINT: http://minio:9000
    POSTGRES_HOST: postgres
  volumes:
    - ./spark_jobs:/opt/pipeline/spark_jobs
    - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./logs/spark-events:/tmp/spark-events
    - ./logs:/opt/pipeline/logs

services:
  minio:
    # Same MinIO release, Bitnami build: minio/minio is no longer published on Docker Hub
    image: bitnamilegacy/minio:2024.12.18
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20

  spark-master:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "7077:7077", "4040:4040"]

  spark-worker-1: &spark-worker
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      MINIO_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on: [spark-master]

  spark-worker-2: *spark-worker

  spark-history:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    ports: ["18080:18080"]

  postgres:
    image: postgres:16
    env_file: .env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.51.9
    ports: ["3000:3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  minio-data:
  pg-data:
