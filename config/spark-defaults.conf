# Mounted into every Spark container at /opt/spark/conf/spark-defaults.conf

spark.master                         spark://spark-master:7077
spark.executor.memory                1536m
spark.executor.cores                 2
spark.driver.memory                  2g
spark.sql.shuffle.partitions         32
spark.sql.adaptive.enabled           true
spark.sql.adaptive.skewJoin.enabled  true

# S3A (MinIO) + PostgreSQL JDBC, downloaded on first spark-submit
spark.jars.packages                  org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.4
spark.jars.ivy                       /tmp/.ivy2

# Event log = processing evidence, browsable at http://localhost:18080
spark.eventLog.enabled               true
spark.eventLog.dir                   file:///tmp/spark-events
spark.history.fs.logDirectory        file:///tmp/spark-events
